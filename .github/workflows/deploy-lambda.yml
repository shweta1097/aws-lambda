#triggers
name: Automated Lambda GitOps Pipeline
on:
  push:
    branches: [main, stagging]
  pull_request:
    branches: [main, staging]
permissions:
  id-token: write  #cruicial for OIDC authentication
  contents: read  #to read the repo contents
  pull-requests: write  #Allows writing output logs back to PR review screens
jobs:
  # JOB 1: Validation Engine (Runs on BOTH Push and Pull Requests)
  validate-and-plan:
    name: Terraform Validate and Plan
    runs-on: ubuntu-latest
    steps:
      - name: checkout code repository 
        uses: actions/checkout@v3
      # Route to the appropriate OIDC IAM Role depending on target branch/PR environment
      - name: Authenticate to AWS via OIDC
        id: assume-role
        uses: aws-actions/configure-aws-credentials@v3
        with:
          role-to-assume: ${{ (github.base_ref == 'main' || github.ref == 'refs/heads/main') && 'arn:aws:iam::120569629518:role/terraform-oidc-deployer-role' || 'arn:aws:iam::120569629518:role/terraform-oidc-deployer-role'}} #ternary operator to route to the appropriate OIDC IAM Role depending on target branch/PR environment
          aws-region: ap-south-1
      - name: setup terraform binary
        uses: hashicorp/setup-terraform@v3
      - name: terraform init
        run: terraform init
      - name: check code formatting
        run: terraform fmt -check
      - name: terraform validate
        run: terraform validate
      - name: terraform plan
        run: terraform plan -out=tfplan
  deploy-infrastructure:
    name: Terraform apply deployment
    needs: validate-and-plan # Ensures deployment only triggers if tests pass successfully
    if: github.event_name == 'push' #Safety mechanism: blocks un-merged PR branches from deploying changes
    runs-on: ubuntu-latest
    steps: 
      - name: checkout code repository
        uses: actions/checkout@v3
       # Route authentication tokens to the correct account target boundary
      - name: Authenticate to AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v3
        with:
          role-to-assume: ${{ (github.ref == 'refs/heads/main') && 'arn:aws:iam::120569629518:role/terraform-oidc-deployer-role' || 'arn:aws:iam::120569629518:role/terraform-oidc-deployer-role'}} #ternary operator to route to the appropriate OIDC IAM Role depending on target branch/PR environment
          aws-region: ap-south-1
      - name: setup terraform binary
        uses: hashicorp/setup-terraform@v3
      - name: Execute live infrastructure deployment
        run: |
          terraform init
          terraform apply -auto-approve tfplan